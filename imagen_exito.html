<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:transparent;color:#222}
.wrap{max-width:940px;margin:0 auto;padding:1.5rem 1.5rem 4rem}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid #ebebeb}
.header h2{font-size:30px;font-weight:300;color:#222}
.header img{height:30px;display:none}
.next{font-family:inherit;font-size:15px;font-weight:500;padding:12px 32px;border:none;border-radius:999px;background:#5fb69a;color:#fff;cursor:pointer;transition:opacity 0.2s}
.download{font-family:inherit;font-size:15px;font-weight:500;padding:12px 32px;border:1.5px solid #5fb69a;border-radius:999px;background:#fff;color:#5fb69a;cursor:pointer;transition:opacity 0.2s}
.next:hover,.download:hover{opacity:0.85}
.btnrow{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.page{display:none;margin-top:48px;padding-top:28px;border-top:1px solid #ebebeb}
.page.show{display:block}

/* palancas */
.palanca{margin-bottom:40px}
.plabel{margin-bottom:14px}
.pname{font-size:17px;font-weight:700;color:#2c3e50}
.psub{font-size:13px;color:#aaa;margin-left:8px}

/* escala visual */
.scale-wrap{position:relative;height:52px;margin:0 8px}
.scale-bg{position:absolute;top:16px;left:0;right:0;height:3px;background:#e0e0e0;border-radius:2px}
.scale-fill{position:absolute;top:16px;left:0;height:3px;background:#5fb69a;border-radius:2px;width:0;transition:width 0.25s ease}
.ticks{position:relative;display:flex;justify-content:space-between;height:100%;z-index:1}
.tk{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;width:32px}
.tk-bar{width:2px;height:16px;background:#d8d8d8;border-radius:1px;margin-top:8px;transition:all 0.15s}
.tk-num{font-size:12px;color:#bbb;margin-top:5px;transition:all 0.15s}
.tk:hover .tk-bar{background:#5fb69a}
.tk:hover .tk-num{color:#5fb69a}
.tk.on .tk-bar{width:4px;height:24px;background:#5fb69a;margin-top:4px;border-radius:2px}
.tk.on .tk-num{color:#5fb69a;font-weight:700;font-size:14px;margin-top:3px}
.tk.filled .tk-bar{background:#5fb69a}

.note{font-size:13px;color:#aaa;font-style:italic;margin-top:16px;text-align:right}

/* tabla reflexión */
.page h3{font-size:22px;font-weight:300;color:#2c3e50;margin-bottom:20px}
.tq{width:100%;border-collapse:collapse;table-layout:fixed}
.tq th{background:#5fb69a;color:#fff;font-weight:700;text-align:left;padding:12px 16px;border:1px solid #fff;font-size:14px}
.tq th.qh{width:30%}
.tq td{border:1px solid #cfcfcf;padding:14px;vertical-align:middle}
.tq td.q{width:30%;text-align:center;font-weight:600;color:#2c3e50;font-size:14px;background:#fafafa;line-height:1.4}
.tq textarea{width:100%;min-height:100px;border:none;resize:vertical;font-family:inherit;font-size:14px;line-height:1.5;background:transparent}
.tq textarea:focus{outline:none}
.footer-note{font-size:12px;color:#bbb;text-align:center;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h2>Las palancas de una imagen de éxito</h2>
    <img id="logoImg" src="images/logo_innerkey.png" alt="innerkey">
  </div>

  <!-- PASO 1 -->
  <div id="p1"></div>

  <!-- PASO 2 -->
  <div class="page" id="p2">
    <table class="tq">
      <thead><tr><th class="qh">Pregunta</th><th>Reflexión</th></tr></thead>
      <tbody id="p2body"></tbody>
    </table>
    <div class="btnrow"><button class="download" onclick="exportPDF()">Descargar PDF</button></div>
  </div>

  <p class="footer-note">borjaarano.com</p>
</div>

<script>
const PAL=[
  {name:'Ser referente en tu área',sub:'(tener un elevado know-how)'},
  {name:'Tener carisma de líder',sub:'(ser buen comunicador)'},
  {name:'Tener visión estratégica',sub:'(marcar el rumbo a largo plazo)'},
  {name:'Tener pasión por crecer',sub:'(tener agresividad comercial)'},
  {name:'Tener coraje empresarial',sub:'(ser creativo y resolutivo)'},
  {name:'Tener simpatía y encanto',sub:'(contagiar ganas de cooperar)'}
];
const QST=[
  '¿Qué motivación interior impulsa tus palancas más fuertes?',
  '¿Qué creencia interior frena tus palancas más débiles?',
  '¿Qué palanca te da más miedo o pereza? ¿Cuál es el motivo?',
  '¿De qué autoengaño te estás dando cuenta?',
  '¿Qué vas a poner en marcha para cultivar y destacar más tu imagen de éxito?'
];

const vals=PAL.map(()=>-1);
const refl=QST.map(()=>'');

// build paso 1
let html='';
PAL.forEach((p,i)=>{
  let ticks='';
  for(let n=0;n<=10;n++){
    ticks+=`<div class="tk" id="tk${i}_${n}" onclick="pickP(${i},${n})"><div class="tk-bar"></div><div class="tk-num">${n}</div></div>`;
  }
  html+=`<div class="palanca">
    <div class="plabel"><span class="pname">${p.name}</span><span class="psub">${p.sub}</span></div>
    <div class="scale-wrap">
      <div class="scale-bg"></div>
      <div class="scale-fill" id="fill${i}"></div>
      <div class="ticks">${ticks}</div>
    </div>
  </div>`;
});
html+=`<p class="note">* No se trata de lo que eres, sino de lo que se ve de ti.</p>`;
html+=`<div class="btnrow"><button class="next" onclick="goP2()">Siguiente</button></div>`;
document.getElementById('p1').innerHTML=html;

function pickP(i,n){
  vals[i]=n;
  for(let k=0;k<=10;k++){
    const el=document.getElementById('tk'+i+'_'+k);
    el.classList.remove('on','filled');
    if(k===n) el.classList.add('on');
    else if(k<n) el.classList.add('filled');
  }
  document.getElementById('fill'+i).style.width=(n/10*100)+'%';
}

// build paso 2
let trows='';
QST.forEach((q,i)=>{
  trows+=`<tr><td class="q">${q}</td><td><textarea oninput="refl[${i}]=this.value"></textarea></td></tr>`;
});
document.getElementById('p2body').innerHTML=trows;

function goP2(){
  const p=document.getElementById('p2');p.classList.add('show');
  setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'start'}),60);
}

// ---- LOGO ----
let logoData=null,logoRatio=36/16;
function loadLogo(){
  const img=document.getElementById('logoImg');
  function ok(){img.style.display='block';try{logoRatio=img.naturalWidth/img.naturalHeight;const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);logoData=c.toDataURL('image/png');}catch(e){}}
  if(img.complete&&img.naturalWidth>0)ok();else{img.onload=ok;}
}

// ---- PDF ----
function common(doc,PW,PH){
  doc.setFillColor(255,255,255);doc.rect(0,0,PW,PH,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(95,182,154);
  doc.text('Las palancas de una imagen de éxito',12,20);
  if(logoData){try{const lw=13*logoRatio;doc.addImage(logoData,'PNG',PW-12-lw,8,lw,13);}catch(e){}}
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(95,182,154);
  doc.text('www.inner-key.com',PW/2,PH-9,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(150,150,150);
  doc.text('Copyright de Innerkey Escuela Transpersonal de Coaching. No se permite su duplicación, transmisión ni reproducción, total o parcial.',PW/2,PH-6,{align:'center'});
}

function drawP1(doc){
  const PW=297,PH=210,M=12;common(doc,PW,PH);
  const labelW=60,scaleX=M+labelW+10,scaleW=PW-2*M-labelW-18;
  const startY=36,rowH=26;
  PAL.forEach((p,i)=>{
    const y=startY+i*rowH;
    // label
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(44,62,80);
    doc.text(p.name,M+labelW,y+2,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(170,170,170);
    doc.text(p.sub,M+labelW,y+7,{align:'right'});
    // scale
    const ly=y+4;
    // bg line
    doc.setDrawColor(210,210,210);doc.setLineWidth(1);
    doc.line(scaleX,ly,scaleX+scaleW,ly);
    // filled line
    if(vals[i]>=0){
      const fx=scaleX+vals[i]/10*scaleW;
      doc.setDrawColor(95,182,154);doc.setLineWidth(1.8);
      doc.line(scaleX,ly,fx,ly);
    }
    // ticks + numbers
    for(let n=0;n<=10;n++){
      const nx=scaleX+n/10*scaleW;
      const isSel=vals[i]===n;
      const isFill=vals[i]>=0&&n<vals[i];
      doc.setDrawColor(isSel||isFill?95:210,isSel||isFill?182:210,isSel||isFill?154:210);
      doc.setLineWidth(isSel?1.6:0.5);
      doc.line(nx,ly-(isSel?6:4),nx,ly+(isSel?6:4));
      doc.setFont('helvetica',isSel?'bold':'normal');doc.setFontSize(isSel?9:7.5);
      doc.setTextColor(isSel?95:170,isSel?182:170,isSel?154:170);
      doc.text(String(n),nx,ly+11,{align:'center'});
    }
  });
  doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(150,150,150);
  doc.text('* No se trata de lo que eres, sino de lo que se ve de ti.',PW-M,startY+PAL.length*rowH+14,{align:'right'});
}

function drawP2(doc){
  const PW=297,PH=210,M=12;common(doc,PW,PH);
  const wq=80,wr=PW-2*M-wq;
  const cols=[{x:M,w:wq},{x:M+wq,w:wr}];
  const top=30,hh=11;
  doc.setFillColor(95,182,154);cols.forEach(c=>doc.rect(c.x,top,c.w,hh,'F'));
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('Pregunta',cols[0].x+4,top+7);doc.text('Reflexión',cols[1].x+4,top+7);
  let y=top+hh;const lineH=4.6,pad=3.4;
  const avail=(PH-14-y);
  QST.forEach((q,i)=>{
    const ql=doc.splitTextToSize(q,cols[0].w-2*pad);
    const rl=doc.splitTextToSize(refl[i]||'',cols[1].w-2*pad);
    const need=Math.max(ql.length,rl.length)*lineH+2*pad;
    const rowH=Math.max(need,avail/5);
    doc.setDrawColor(120,120,120);doc.setLineWidth(0.3);cols.forEach(c=>doc.rect(c.x,y,c.w,rowH));
    doc.setFillColor(250,250,250);doc.rect(cols[0].x,y,cols[0].w,rowH,'F');doc.rect(cols[0].x,y,cols[0].w,rowH,'S');
    doc.setTextColor(44,62,80);doc.setFont('helvetica','bold');doc.setFontSize(10);
    let qy=y+rowH/2-((ql.length-1)*2.4);ql.forEach(l=>{doc.text(l,cols[0].x+cols[0].w/2,qy,{align:'center'});qy+=4.8;});
    doc.setTextColor(60,60,60);doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    let ry=y+pad+2.6;rl.forEach(l=>{doc.text(l,cols[1].x+pad,ry);ry+=lineH;});
    y+=rowH;
  });
}

function exportPDF(){
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    drawP1(doc);
    doc.addPage('a4','landscape');drawP2(doc);
    doc.save('palancas-imagen-de-exito.pdf');
  }catch(err){console.error(err);}
}

loadLogo();
</script>
</body>
</html>
