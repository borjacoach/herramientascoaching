<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:transparent;color:#222}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 4rem}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #ebebeb}
.header h2{font-size:28px;font-weight:300;color:#222}
.header img{height:30px;display:none}

.t{width:100%;border-collapse:collapse;table-layout:fixed}
.t th{background:#5fb69a;color:#fff;font-weight:700;text-align:center;padding:10px 8px;border:1px solid #fff;font-size:12.5px;line-height:1.3}
.t th.c0{width:36px}
.t th.c1{width:30%}
.t th.c4{width:26%}
.t td{border:1px solid #dcdcdc;padding:0;vertical-align:top}
.t td.num{text-align:center;font-weight:600;color:#5fb69a;font-size:14px;padding:10px 0;background:#fafafa}
.t textarea{width:100%;min-height:72px;border:none;resize:vertical;font-family:inherit;font-size:13px;color:#333;line-height:1.45;padding:10px;background:transparent}
.t textarea:focus{outline:none;background:#f8fcfa}

.addrow{text-align:center;padding:10px;cursor:pointer;color:#5fb69a;font-weight:600;font-size:14px;border:1px dashed #c8e6da;border-top:none;border-radius:0 0 8px 8px;transition:background 0.15s}
.addrow:hover{background:#f4faf8}

.download{font-family:inherit;font-size:15px;font-weight:500;padding:12px 32px;border:1.5px solid #5fb69a;border-radius:999px;background:#fff;color:#5fb69a;cursor:pointer;transition:opacity 0.2s}
.download:hover{opacity:0.85}
.btnrow{margin-top:28px;display:flex;gap:12px}
.footer-note{font-size:12px;color:#bbb;text-align:center;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h2>Las resignaciones desatendidas</h2>
    <img id="logoImg" src="images/logo_innerkey.png" alt="innerkey">
  </div>

  <table class="t">
    <thead><tr>
      <th class="c0">Nº</th>
      <th class="c1">¿Qué situaciones estás soportando, que te restan energía?</th>
      <th>¿Quién lo provoca?</th>
      <th>¿Cuánto te desgasta?</th>
      <th class="c4">¿Qué decides? ¿Aceptarlo desde la paz? ¿Cambiarlo? ¿Cómo?</th>
      <th>¿Cuándo empiezas?</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="addrow" onclick="addRow()">＋ Añadir fila</div>

  <div class="btnrow"><button class="download" onclick="exportPDF()">Descargar PDF</button></div>
  <p class="footer-note">borjaarano.com</p>
</div>

<script>
const COLS=['sit','quien','cuanto','decide','cuando'];
const rows=[];
let nextN=1;

function addRow(){
  const id=nextN++;
  rows.push({id,sit:'',quien:'',cuanto:'',decide:'',cuando:''});
  const tr=document.createElement('tr');
  tr.id='row'+id;
  let html=`<td class="num">${id}</td>`;
  COLS.forEach(c=>{html+=`<td><textarea oninput="updateVal(${id},'${c}',this.value)"></textarea></td>`;});
  tr.innerHTML=html;
  document.getElementById('tbody').appendChild(tr);
}

function updateVal(id,col,val){const r=rows.find(x=>x.id===id);if(r)r[col]=val;}

// init 5 rows
for(let i=0;i<5;i++)addRow();

// ---- LOGO ----
let logoData=null,logoRatio=36/16;
function loadLogo(){const img=document.getElementById('logoImg');function ok(){img.style.display='block';try{logoRatio=img.naturalWidth/img.naturalHeight;const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);logoData=c.toDataURL('image/png');}catch(e){}}if(img.complete&&img.naturalWidth>0)ok();else img.onload=ok;}

// ---- PDF ----
function exportPDF(){
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const PW=297,PH=210,M=10;
    const heads=['Nº','¿Qué situaciones estás soportando, que te restan energía?','¿Quién lo provoca?','¿Cuánto te desgasta?','¿Qué decides? ¿Aceptarlo desde la paz? ¿Cambiarlo? ¿Cómo?','¿Cuándo empiezas?'];
    const ws=[12,82,38,32,78,35];
    const lineH=4,pad=3;
    const ROWS_PER_PAGE=12;
    let pageRows=[...rows];
    let pageNum=0;

    while(pageRows.length>0||pageNum===0){
      if(pageNum>0)doc.addPage('a4','landscape');
      doc.setFillColor(255,255,255);doc.rect(0,0,PW,PH,'F');
      // header
      doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(95,182,154);
      doc.text('Las resignaciones desatendidas',M,20);
      if(logoData){try{const lw=13*logoRatio;doc.addImage(logoData,'PNG',PW-M-lw,8,lw,13);}catch(e){}}
      // footer
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(95,182,154);
      doc.text('www.inner-key.com',PW/2,PH-9,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(150,150,150);
      doc.text('Copyright de Innerkey Escuela Transpersonal de Coaching. No se permite su duplicación, transmisión ni reproducción, total o parcial.',PW/2,PH-6,{align:'center'});

      // table header
      const top=28,hh=12;
      let x=M;
      doc.setFillColor(95,182,154);
      ws.forEach(w=>{ doc.rect(x,top,w,hh,'F');x+=w; });
      doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(7.5);
      x=M;
      heads.forEach((h,i)=>{
        const ln=doc.splitTextToSize(h,ws[i]-4);
        let ty=top+(hh-ln.length*3.2)/2+2.8;
        ln.forEach(l=>{doc.text(l,x+ws[i]/2,ty,{align:'center'});ty+=3.2;});
        x+=ws[i];
      });

      // rows
      const batch=pageRows.splice(0,ROWS_PER_PAGE);
      const avail=PH-16-top-hh;
      const rowH=avail/ROWS_PER_PAGE;
      let y=top+hh;

      batch.forEach(r=>{
        x=M;
        doc.setDrawColor(210,210,210);doc.setLineWidth(0.25);
        ws.forEach(w=>{doc.rect(x,y,w,rowH);x+=w;});
        // Nº
        doc.setTextColor(95,182,154);doc.setFont('helvetica','bold');doc.setFontSize(10);
        doc.text(String(r.id),M+ws[0]/2,y+rowH/2+2,{align:'center'});
        // content
        doc.setTextColor(60,60,60);doc.setFont('helvetica','normal');doc.setFontSize(7.5);
        const vals=[r.sit,r.quien,r.cuanto,r.decide,r.cuando];
        let cx=M+ws[0];
        vals.forEach((v,i)=>{
          if(v){
            const ln=doc.splitTextToSize(v,ws[i+1]-2*pad);
            let ty=y+pad+2;
            ln.forEach(l=>{if(ty<y+rowH-2){doc.text(l,cx+pad,ty);ty+=lineH;}});
          }
          cx+=ws[i+1];
        });
        y+=rowH;
      });

      // empty rows to fill page
      const remaining=ROWS_PER_PAGE-batch.length;
      for(let i=0;i<remaining;i++){
        x=M;
        doc.setDrawColor(210,210,210);doc.setLineWidth(0.25);
        ws.forEach(w=>{doc.rect(x,y,w,rowH);x+=w;});
        y+=rowH;
      }

      pageNum++;
    }
    doc.save('resignaciones-desatendidas.pdf');
  }catch(err){console.error(err);}
}

loadLogo();
</script>
</body>
</html>
